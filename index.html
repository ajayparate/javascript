<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Design</title>
    <style>
        .myform{
            width:800px;
            height: 600px;
            background-image: -webkit-linear-gradient(top, #3b3b3b, #373737 );
            border-radius: 7px;
            font-family: Arial, Helvetica, sans-serif;
        }
        .myform >div{
            height: 200px;
            background: #373737;
            line-height: 60px;
            text-align: center;
            color: white;
            font-size: xxx-large ;
            text-shadow: 0px -1px 0px rgba(0, 0, 0, 0.5);
            
        }
        .myform > input{
            display: block;
            width: 775px;
            height: 38px;
            border-radius: 20px;
            margin: 7px auto;
            background-image: -webkit-linear-gradient(top, #b1b1b1, #d7d7d7);
            box-shadow: 0px 1px 1px #5b595b;
            

        }
        #p2{
            margin: auto;
            text-align: center;
        }
    </style>
</head>
<body>
    <form class="myform" action="">
        <div>Create an Form</div>
        <input type="text" alt="ajay">
        <input type="number">
        <input type="email"> 
        <input type="password">
        <input type="signup">
        <h5 id="p2">I agree to terms and condition </h5>
    </form>
</body>
</html>
